        <header class="top-header">
            <div class="header-title-group">
                <h2 id="page-title">Dashboard Overview</h2>
                <div id="datetime-display" class="dt-chips">
                    <span class="dt-chip">
                        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <rect x="3" y="4.5" width="18" height="16.5" rx="3"></rect>
                            <path d="M3 10h18M8 2.5v4M16 2.5v4"></path>
                        </svg>
                        <span id="dt-date">Loading...</span>
                    </span>
                    <span class="dt-chip">
                        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <circle cx="12" cy="12" r="9"></circle>
                            <path d="M12 7v5l3 2"></path>
                        </svg>
                        <span id="dt-time">--:--:-- --</span>
                    </span>
                </div>
            </div>

            <div class="admin-profile" style="display: flex; align-items: center; gap: 12px;">
                {# aria-label / title / aria-pressed are kept in sync with the actual theme by
                     syncThemeToggleState() in app-core.js, so the control always
                     says what pressing it will do rather than the generic
                     "Toggle Dark Mode". #}
                <button type="button" class="theme-toggle" id="themeToggle"
                    title="Switch to dark mode" aria-label="Switch to dark mode" aria-pressed="false">
                    <svg class="theme-icon moon-icon" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 3c.132 0 .263 0 .393 0a7.5 7.5 0 0 0 7.92 12.446a9 9 0 1 1 -8.313 -12.454z" />
                    </svg>
                    <svg class="theme-icon sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                </button>
            </div>
        </header>
