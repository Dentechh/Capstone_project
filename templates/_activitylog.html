<div id="section-activitylog" class="content-section">
    <div class="income-trend-card activity-card" id="activityLogCard">
        <div class="activity-header">
            <div>
                <h3>Activity Log</h3>
                <p>What the admin and dentist did, newest first. Entries can't be edited or deleted.</p>
            </div>
            <button type="button" id="activity-download-btn" class="financial-download-btn"
                onclick="downloadActivityLogPDF()">
                <span class="material-symbols-rounded" aria-hidden="true">download</span>
                <span>Download PDF</span>
            </button>
        </div>

        <div class="activity-toolbar">
            <div class="activity-chip-group" id="activityCategoryGroup" role="group" aria-label="Filter by type of activity">
                <button type="button" class="unpaid-filter-btn active" data-cat="all" onclick="setActivityCategory('all')">
                    <span class="material-symbols-rounded" aria-hidden="true">format_list_bulleted</span><span>All</span>
                </button>
                <button type="button" class="unpaid-filter-btn" data-cat="patients" onclick="setActivityCategory('patients')">
                    <span class="material-symbols-rounded" aria-hidden="true">groups</span><span>Patients</span>
                </button>
                <button type="button" class="unpaid-filter-btn" data-cat="billing" onclick="setActivityCategory('billing')">
                    <span class="material-symbols-rounded" aria-hidden="true">payments</span><span>Billing</span>
                </button>
                <button type="button" class="unpaid-filter-btn" data-cat="appointments" onclick="setActivityCategory('appointments')">
                    <span class="material-symbols-rounded" aria-hidden="true">event</span><span>Appointments</span>
                </button>
                <button type="button" class="unpaid-filter-btn" data-cat="calendar" onclick="setActivityCategory('calendar')">
                    <span class="material-symbols-rounded" aria-hidden="true">calendar_month</span><span>Calendar</span>
                </button>
                <button type="button" class="unpaid-filter-btn" data-cat="security" onclick="setActivityCategory('security')">
                    <span class="material-symbols-rounded" aria-hidden="true">login</span><span>Sign-ins</span>
                </button>
            </div>
        </div>

        <div class="activity-toolbar activity-toolbar--fields">
            <div class="activity-field">
                <label>Staff</label>
                <div class="activity-custom-select" id="activityAdminWrap">
                    <button type="button" id="activityAdminBtn" class="activity-select-trigger"
                        aria-haspopup="listbox" aria-expanded="false" onclick="toggleActivityAdminMenu()">
                        <span id="activityAdminLabel">All staff</span>
                        <span class="activity-select-chevron"></span>
                    </button>
                    <div id="activityAdminMenu" class="activity-select-menu" role="listbox" hidden></div>
                </div>
            </div>
            <div class="activity-field activity-field--grow">
                <label for="activitySearch">Search</label>
                <input type="text" id="activitySearch" class="activity-input" placeholder="Search patient or details..."
                    aria-label="Search the activity log" oninput="renderActivityLog()">
            </div>
        </div>

        <div class="activity-range">
            <div class="activity-field">
                <label>Quick range</label>
                <div class="activity-custom-select" id="activityRangeWrap">
                    <button type="button" id="activityRangeBtn" class="activity-select-trigger"
                        aria-haspopup="listbox" aria-expanded="false" onclick="toggleActivityRangeMenu()">
                        <span id="activityRangeLabel">Today</span>
                        <span class="activity-select-chevron"></span>
                    </button>
                    <div id="activityRangeMenu" class="activity-select-menu" role="listbox" hidden>
                        <button type="button" class="activity-select__option" data-value="14" onclick="applyActivityPreset('14'); closeActivityRangeMenu();">Last 14 days</button>
                        <button type="button" class="activity-select__option" data-value="1" onclick="applyActivityPreset('1'); closeActivityRangeMenu();">Today</button>
                        <button type="button" class="activity-select__option" data-value="7" onclick="applyActivityPreset('7'); closeActivityRangeMenu();">Last 7 days</button>
                        <button type="button" class="activity-select__option" data-value="30" onclick="applyActivityPreset('30'); closeActivityRangeMenu();">Last 30 days</button>
                        <button type="button" class="activity-select__option" data-value="60" onclick="applyActivityPreset('60'); closeActivityRangeMenu();">Last 60 days</button>
                        <button type="button" class="activity-select__option" data-value="90" onclick="applyActivityPreset('90'); closeActivityRangeMenu();">Last 90 days</button>
                        <button type="button" class="activity-select__option" data-value="month" onclick="applyActivityPreset('month'); closeActivityRangeMenu();">This month</button>
                        <button type="button" class="activity-select__option" data-value="custom" onclick="applyActivityPreset('custom'); closeActivityRangeMenu();">Custom</button>
                    </div>
                </div>
                <input type="hidden" id="activityRangePreset" value="1">
            </div>
            <div class="activity-field activity-field--date">
                <label for="activityFrom">From</label>
                <input type="date" id="activityFrom" class="activity-date" onchange="onActivityDateChange()">
            </div>
            <div class="activity-field activity-field--date">
                <label for="activityTo">To</label>
                <input type="date" id="activityTo" class="activity-date" onchange="onActivityDateChange()">
            </div>
            <div class="activity-range__actions">
                <button type="button" class="unpaid-filter-btn" onclick="applyActivityRange()">
                    <span class="material-symbols-rounded" aria-hidden="true">search</span><span>Show</span>
                </button>
                <button type="button" class="unpaid-filter-btn" onclick="resetActivityRange()">
                    <span class="material-symbols-rounded" aria-hidden="true">restart_alt</span><span>Reset</span>
                </button>
            </div>
        </div>

        <div class="activity-table-wrap">
            <table class="activity-table" id="activityTable">
                <thead>
                    <tr>
                        <th class="act-col-when">When</th>
                        <th class="act-col-staff">Staff</th>
                        <th class="act-col-action">Action</th>
                        <th class="act-col-patient">Patient</th>
                        <th class="act-col-details">Details</th>
                    </tr>
                </thead>
                <tbody id="activityTableBody">
                    <tr><td colspan="5" class="unpaid-empty">Loading...</td></tr>
                </tbody>
            </table>
        </div>

        <div class="activity-foot">
            <span id="activityStatus" class="activity-status" aria-live="polite"></span>
            <div class="mypatients-pagination" id="activityPagination" style="display:flex; gap:8px; align-items:center; justify-content:center; margin-top:12px; flex-wrap:wrap;">
                <button type="button" id="activityPrevBtn" class="btn-action filter-btn">Prev</button>
                <span id="activityPageNumbers" style="display:flex; gap:4px; flex-wrap:wrap;"></span>
                <button type="button" id="activityNextBtn" class="btn-action filter-btn">Next</button>
                <span id="activityPageInfo" style="margin-left:8px;"></span>
            </div>
            <button type="button" id="activityMoreBtn" class="unpaid-filter-btn" style="display:none;"
                onclick="loadActivityLog(false)">
                <span class="material-symbols-rounded" aria-hidden="true">history</span>
                <span>Load earlier days</span>
            </button>
        </div>
    </div>
</div>
