<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capizonda | Notice</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/logo_lightMode.png') }}">
    <link href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Kumbh Sans', sans-serif;
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; margin: 0; background: #f8f9fa; color: #222;
        }
        body.dark-mode { background: #121212; color: #f5f5f5; }
        .card {
            background: #fff; border-radius: 16px; padding: 40px;
            max-width: 420px; width: 90%; text-align: center;
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
        }
        body.dark-mode .card { background: #1e1e1e; box-shadow: 0 8px 30px rgba(0,0,0,0.4); }
        .logo { width: 70px; height: 70px; object-fit: contain; margin-bottom: 12px; }
        h1 { color: #64b5f6; font-size: 1.6rem; margin: 0 0 12px; letter-spacing: 1px; }
        p { color: #666; line-height: 1.5; margin: 0 0 24px; }
        body.dark-mode p { color: #aaa; }
        .btn {
            display: inline-block; padding: 10px 24px; border-radius: 8px;
            background: #1976d2; color: #fff; text-decoration: none; font-weight: 600;
        }
        .btn:hover { background: #1565c0; }
    </style>
</head>
<body>
    <div class="card">
        <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Capizonda Logo" class="logo">
        <h1>CAPIZONDA</h1>
        <p>{{ message or "Something went wrong. Please try again." }}</p>
        <a href="/" class="btn">Back to Home</a>
    </div>
    <script>
        if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark-mode');
    </script>
</body>
</html>
